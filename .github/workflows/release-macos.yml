# Build e release macOS (roda na nuvem — dev no Windows)
# Disparo: git tag v1.0.1 && git push origin v1.0.1
#
# Secrets (Actions):
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (pode ser vazio)

name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-13
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    name: Build macOS (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Verify migrations
        run: npm run verify-migrations

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Controle de Estoque ${{ github.ref_name }}"
          releaseBody: |
            Atualização do sistema Controle de Estoque — Dra. Ana Morong.

            **macOS**
            - Apple Silicon (M1/M2/M3/M4): pacote **aarch64**
            - Intel: pacote **x86_64**

            Os dados locais (pacientes, estoque, financeiro) são preservados.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

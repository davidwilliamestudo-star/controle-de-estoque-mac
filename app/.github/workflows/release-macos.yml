# Build e release do app para macOS (roda na nuvem — você usa Windows)
# Uso:
#   1) git tag v1.0.1 && git push origin v1.0.1
#   2) Actions gera .app/.dmg e anexa ao GitHub Release
#
# Secrets necessários (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          (chave privada do tauri signer)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (se a chave tiver senha; senão pode omitir)
#
# Opcional (assinatura Apple — só se tiver conta Developer):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, etc.

name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex: v1.0.1) — opcional no dispatch"
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Macs novos (M1/M2/M3/M4) — caso mais comum
          - platform: macos-14
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          # Macs Intel (opcional; comente se a doutora for só Apple Silicon)
          - platform: macos-13
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    name: Build macOS (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Verify migrations
        run: npm run verify-migrations

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Cria/atualiza o Release da tag
          tagName: ${{ github.ref_name }}
          releaseName: "Controle de Estoque ${{ github.ref_name }}"
          releaseBody: |
            Atualização do sistema Controle de Estoque — Dra. Ana Morong.

            **macOS:** baixe o `.dmg` correspondente ao chip do Mac:
            - **Apple Silicon (M1/M2/M3/M4):** aarch64
            - **Intel:** x86_64

            Os dados locais (pacientes, estoque) são preservados na atualização.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
